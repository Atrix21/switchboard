<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switchboard</title>
<style>/*CSS*/</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="8.5" cy="20" r="4.6"/><circle cx="23.5" cy="12" r="4.6"/><path d="M12.4 18.2 C 16 22, 18 17, 19.8 13.6"/></svg>
    <span>Switchboard</span>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">Connecting to the service…</div>
  <div class="bar-actions">
    <button class="ghost" id="pause" type="button">Pause</button>
    <button class="icon" id="open-settings" type="button" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
</header>

<main class="layout">
  <section class="desk-wrap" aria-label="Your desk">
    <div class="nearby" id="nearby" hidden></div>
    <div class="seg" role="group" aria-label="Desk view">
      <button type="button" data-view="flat" aria-pressed="true">Flat</button>
      <button type="button" data-view="3d" aria-pressed="false">3D</button>
    </div>
    <svg id="desk" class="desk" role="img" aria-label="Arrangement of your computers and displays"></svg>
    <div id="desk3d" class="desk3d" hidden aria-label="3D view of your desk. Drag to orbit, drag a display to move it, scroll to zoom."></div>
    <div class="desk-hint" id="desk-hint"></div>
    <div class="plan" id="plan" hidden>
      <span id="plan-text">New arrangement</span>
      <button class="ghost" id="plan-reset" type="button">Undo</button>
      <button class="primary" id="plan-apply" type="button">Use this arrangement</button>
    </div>
  </section>
  <aside class="inspector" id="inspector" aria-live="polite"></aside>
</main>

<div class="toast" id="toast" hidden></div>

<div class="sheet" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="settings-title">Settings</h2>
      <button class="icon" id="close-settings" type="button" aria-label="Close settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="settings-body"></div>
  </div>
</div>

<div class="sheet" id="pairing" hidden role="dialog" aria-modal="true" aria-labelledby="pair-title">
  <div class="sheet-panel narrow">
    <div class="pair">
      <h2 id="pair-title">Pair with <span id="pair-name"></span></h2>
      <p>Check that both computers show the same code.</p>
      <div class="code" id="pair-code" aria-label="Pairing code"></div>
      <p class="muted" id="pair-note">Then confirm on both computers.</p>
      <div class="pair-actions">
        <button class="ghost" id="pair-reject" type="button">They don't match</button>
        <button class="primary" id="pair-accept" type="button">Codes match</button>
      </div>
    </div>
  </div>
</div>

<script>/*THREE*/</script>
<script>/*JS*/</script>
<script>/*DESK3D*/</script>
</body>
</html>
